# Optional: regenerate MyLibrary.xcodeproj with XcodeGen (`xcodegen generate`).
# The checked-in project file works as-is; this exists so the project can be
# rebuilt from scratch without hand-editing pbxproj.
name: MyLibrary
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-Osize"
      GCC_OPTIMIZATION_LEVEL: s
      DEAD_CODE_STRIPPING: YES
      LLVM_LTO: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      ASSETCATALOG_COMPILER_OPTIMIZATION: space

targets:
  MyLibrary:
    type: application
    platform: iOS
    sources:
      - MyLibrary
    settings:
      base:
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MyLibrary
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
